id: "odwolanie"
nazwa: "Treść odwołania do KIO"
opis: "Pismo odwoławcze kierowane do Prezesa Krajowej Izby Odwoławczej"

klasyfikacja:
  filtry_nazw_plikow:
    - "odwolanie"
    - "odwolanie.pdf"
    - "odwolanie.json"
  frazy_kluczowe:
    - "odwołanie"
    - "odwołuje"
    - "wnoszę o uchylenie"
    - "krajowa izba odwoławcza"
    - "czynność zamawiającego"
    - "odwołujący"
  prog_pewnosci: 0.62

ekstrakcja:
  schema_name: "OdwolanieSchema"
  max_tokens: 450
  max_chars: 10000
  exclude_llm_fields:
    - "czynnosc_opis"
    - "data"
    - "miejscowosc"
    - "krs"
    - "nip"
    - "regon"
    - "mail"
    - "numer_bzp"
    - "numer_ted"
  force_string_fields: []
  system_prompt: |
    Ekstrahujesz dane z polskiego odwołania do KIO do ścisłego JSON.
  wskazowki:
    - "Zwracaj null jeśli brak informacji w tekście (nie zgaduj i nie przepisuj wzorców)."
    - "Daty podawaj w formacie YYYY-MM-DD."
    - "czynnosc_dzien i czynnosc_powod_id ustalaj WYŁĄCZNIE dla pierwszego zarzutu/zaskarżonej czynności."
    - "Kody czynnosc_powod_id (1-12): {czynnosc_dict}."
    - "Odwolujacy to WYŁĄCZNIE podmiot z sekcji ODWOŁUJĄCY (nigdy nie dodawaj tam Zamawiającego ani Wykonawcy wybranego!); jeśli jest konsorcjum, podaj tylko Lidera; przez-pelnomocnika=1 gdy działa pełnomocnik, inaczej 0."
    - "pelnomocnik to tablica obiektów dla WSZYSTKICH pełnomocników Odwołującego (pusta lista [] gdy przez-pelnomocnika=0); w każdym elemencie imie_nazwisko podaj bez tytułu zawodowego, a nazwa to nazwa kancelarii/firmy (np. z adresu do korespondencji), NIE imię i nazwisko."
    - "numer_postepowania to znak/nr referencyjny sprawy (np. ZP.431.2026), a tytul to nazwa zamówienia po „pn.”."
  section_swarm:
    header_max_tokens: 320
    action_max_tokens: 140
    header_system_prompt: |
      Ekstrahujesz strony (Odwołujący, Zamawiający) oraz numer_postepowania i tytul zamówienia publicznego do JSON.
      Zasady:
      - Zwracaj null jeśli brak informacji w tekście (nie zgaduj i nie przepisuj wzorców).
      - Odwolujacy to WYŁĄCZNIE podmiot z sekcji ODWOŁUJĄCY (dla konsorcjum: tylko Lider; nigdy nie dodawaj tam Zamawiającego ani Wykonawcy wybranego!).
      - przez-pelnomocnika=1 gdy działa pełnomocnik, inaczej 0.
      - pelnomocnik to tablica obiektów dla WSZYSTKICH pełnomocników Odwołującego (pusta lista [] gdy przez-pelnomocnika=0); imie_nazwisko bez tytułu zawodowego, a nazwa to nazwa kancelarii/firmy zatrudniającej pełnomocnika (np. z adresu do korespondencji), NIE imię i nazwisko.
      - numer_postepowania to znak/nr referencyjny sprawy (np. ZP.431.2026), a tytul to nazwa zamówienia po „pn.”.
    action_system_prompt: |
      Ekstrahujesz WYŁĄCZNIE datę czynności (czynnosc_dzien, YYYY-MM-DD lub null) oraz czynnosc_powod_id (liczba 1-12) wyłącznie dla pierwszego zarzutu/zaskarżonej czynności.
      Ignoruj datę uchwalenia ustawy Pzp (2019-09-11). Szukaj daty czynności Zamawiającego (np. unieważnienia, ogłoszenia, publikacji SWZ) i zapisz ją jako YYYY-MM-DD.
      Kody czynnosc_powod_id: {czynnosc_dict}.

normalizacja:
  wymagane_pola:
    - "OdwolanieKIO.czynnosc_powod_id"
    - "Odwolujacy"
    - "Zamawiajacy"
  formaty:
    nip: "cyfry_10"
    krs: "cyfry_10"
    regon: "cyfry_9_lub_14"
    daty: "YYYY-MM-DD"

id: "pelnomocnictwo"
nazwa: "Pełnomocnictwo"
opis: "Dokument udzielenia pełnomocnictwa procesowego w sprawie odwoławczej KIO"

klasyfikacja:
  filtry_nazw_plikow:
    - "pelnomocnictwo"
    - "pelnomocnictwo.pdf"
    - "pelnomocnictwo.json"
  frazy_kluczowe:
    - "pełnomocnictwo"
    - "pełnomocnika"
    - "mocodawca"
    - "pełnomocnik"
    - "udzielam pełnomocnictwa"
    - "pełnomocnictwo ogólne"
  prog_pewnosci: 0.62

ekstrakcja:
  schema_name: "PelnomocnictwoSchema"
  max_tokens: 500
  max_chars: 6000
  exclude_llm_fields: []
  force_string_fields:
    - "pesel"
  system_prompt: |
    Ekstrahujesz dane z polskiego pełnomocnictwa do ścisłego JSON.
  wskazowki:
    - "Zwracaj null jeśli brak pola (nie zgaduj)."
    - "mocodawca[].data.typ to 'osoba_prawna' lub 'osoba_fizyczna'; dla osoby prawnej imie_nazwisko=null."
    - "podpisujacy to lista osób podpisujących w imieniu mocodawcy."
    - "pelnomocnicy[].imie_nazwisko podawaj w mianowniku, bez tytułów zawodowych."
    - "pesel to WYŁĄCZNIE 11-cyfrowy numer PESEL (nigdy numer wpisu na listę radców/adwokatów — wtedy zwróć null)."

normalizacja:
  wymagane_pola:
    - "mocodawca"
    - "pelnomocnicy"
  formaty:
    nip: "cyfry_10"
    krs: "cyfry_10"
    pesel: "cyfry_11"

id: "pelnomocnictwo"
nazwa: "Pełnomocnictwo"
opis: "Dokument udzielenia pełnomocnictwa procesowego w sprawie odwoławczej KIO"

klasyfikacja:
  filtry_nazw_plikow:
    - "pelnomocnictwo"
    - "pelnomocnictwo.pdf"
    - "pelnomocnictwo.json"
  frazy_kluczowe:
    - "pełnomocnictwo"
    - "pełnomocnika"
    - "mocodawca"
    - "pełnomocnik"
    - "udzielam pełnomocnictwa"
    - "pełnomocnictwo ogólne"
  prog_pewnosci: 0.62

ekstrakcja:
  schema_name: "PelnomocnictwoSchema"
  max_tokens: 300
  max_chars: 6000
  exclude_llm_fields:
    - "krs"
    - "nip"
    - "pesel"
  force_string_fields:
    - "pesel"
  system_prompt: |
    Ekstrahujesz dane z polskiego pełnomocnictwa do ścisłego JSON.
  wskazowki:
    - "Zwracaj null jeśli brak pola (nie zgaduj)."
    - "mocodawca[].data.nazwa to pełna nazwa firmy/podmiotu mocodawcy (np. 'Belmoria Rozwiązania S.A.'), nigdy numer KRS ani NIP."
    - "mocodawca[].data.typ to 'osoba_prawna' lub 'osoba_fizyczna'; dla osoby prawnej imie_nazwisko=null."
    - "podpisujacy to wyłącznie osoby podpisujące w imieniu Mocodawcy (np. Prezes Zarządu, Prokurent, Wspólnik) — NIGDY nie wpisuj tam pełnomocników z sekcji 'Pełnomocnictwo przyjmuję'."
    - "pelnomocnicy[].imie_nazwisko podawaj w mianowniku, bez tytułów zawodowych."

normalizacja:
  wymagane_pola:
    - "mocodawca"
    - "pelnomocnicy"
  formaty:
    nip: "cyfry_10"
    krs: "cyfry_10"
    pesel: "cyfry_11"

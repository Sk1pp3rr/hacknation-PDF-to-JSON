[project]
name = "odwolania2json"
version = "0.1.0"
description = "System ekstrakcji danych ze spraw odwoławczych UZP (PDF -> JSON)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "httpx>=0.27.0",
    "streamlit>=1.40.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["backend", "backend.services"]
